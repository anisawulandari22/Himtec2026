name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Accept Android SDK Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate Official Android Platform
        run: |
          rm -rf android
          flutter create . --platforms=android --org=org.himtec --project-name=himtec_app

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Android APK (Debug & Release)
        run: |
          echo "Building Debug APK..."
          flutter build apk --debug
          echo "Building Release APK..."
          flutter build apk --release || echo "Release build warning, using debug APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: himtec-app-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
